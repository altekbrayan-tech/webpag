services:
  web:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - dokploy-network
      - internal
    labels:
      - "traefik.enable=true"
      # Asigna el router para tu dominio
      - "traefik.http.routers.mi-web.rule=Host(`web.clouddec.com`)"
      - "traefik.http.routers.mi-web.entrypoints=websecure"
      - "traefik.http.routers.mi-web.tls.certresolver=letsencrypt"
      # FORZAR EL PUERTO INTERNO: Evita que Traefik pierda la ruta tras reconexiones
      - "traefik.http.services.mi-web.loadbalancer.server.port=80"

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    labels:
      - "traefik.enable=false"

  db:
    image: postgres:16-alpine
    # Hostname único y estable dentro de dokploy-network para que otros
    # contenedores del mismo Dokploy (p. ej. pgAdmin) puedan resolverlo sin
    # colisionar con un servicio "db" de otra app en esa misma red compartida.
    hostname: clouddec-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=false"

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge

volumes:
  pgdata:
